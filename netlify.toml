[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 라우팅이 없는 단일 페이지라 사실상 필요 없지만,
# 주소를 잘못 입력해도 앱이 뜨도록 둔다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 해시가 붙은 자산은 내용이 바뀌면 파일명도 바뀌므로 영구 캐시해도 안전하다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 서비스 워커는 절대 캐시하지 않는다. 캐시되면 앱이 갱신되지 않는다.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
